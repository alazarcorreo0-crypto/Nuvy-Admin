# Publica Nuvy Admin en GitHub Pages.
#
# - Se ejecuta en cada push a main (y a mano desde la pestaña Actions).
# - Antes de publicar corren los tests y la revisión de sintaxis.
# - "enablement: true" vuelve a activar Pages si estaba desactivado.
# - Solo se suben los archivos de la app, no tests ni configuración del repo.

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # Primero se verifica que todo esté en orden: los tests y la revisión
  # de sintaxis deben pasar ANTES de publicar. Si algo falla, el sitio
  # no se actualiza.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Correr los tests
        run: npm test

      - name: Revisar sintaxis y archivos
        run: npm run check

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Preparar el sitio estático
        run: |
          mkdir -p _site
          cp -r index.html manifest.json sw.js css js icons vendor _site/
          touch _site/.nojekyll

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
